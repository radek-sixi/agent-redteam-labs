name: Agent Security Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  agent-redteam-scan:
    name: Autonomous Agent Security Probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Target Agent Environment
        run: |
          # Start agent under test in background
          python3 app/agent.py &
          sleep 5

      - name: Install sixi-scanner
        run: |
          go install github.com/rbrus/sixi-scanner/cmd/sixi-scanner@latest

      - name: Execute Security Scan & Generate SARIF
        run: |
          sixi-scanner scan \
            --target chat \
            --url http://127.0.0.1:8080/chat \
            --format sarif \
            --out agent-security-results.sarif \
            --min-severity critical

      - name: Upload SARIF Report to GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: agent-security-results.sarif
          category: sixi-scanner
